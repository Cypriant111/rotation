<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rotation</title>
    <meta name="description" content="Your Apple Music listening stats" />

    <!-- link previews (Open Graph / Twitter); image regenerated by `npm run og` -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rotation" />
    <meta property="og:title" content="Rotation — your Apple Music listening, in numbers" />

    <meta property="og:url" content="https://cypriant111.github.io/rotation/" />
    <meta property="og:image" content="https://cypriant111.github.io/rotation/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rotation: your Apple Music listening, in numbers" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/rotation/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/rotation/icons/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rotation" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
